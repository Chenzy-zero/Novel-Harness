name: 剧情弧 ARC（Epic）
description: 主线或主要支线，挂接剧情节点
title: "[ARC] "
body:
  - type: input
    id: stable_id
    attributes:
      label: 稳定ID（ARC-001）
    validations:
      required: true
  - type: input
    id: canonical_file
    attributes:
      label: 剧情弧文件路径
      placeholder: outline/arcs/ARC-001.md
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 剧情目标、当前阶段、完成条件、最新变更章节
    validations:
      required: true
  - type: textarea
    id: children
    attributes:
      label: 关联 BEAT / CHAR / THREAD 与 Issue
