name: Build Project Starter release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (must match VERSION)"
        required: true
        default: "0.1.0"
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Build and verify Starter archives
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$(cat VERSION)" = "$RELEASE_VERSION"
          python3 scripts/package_release.py --version "$RELEASE_VERSION" --output-dir dist
          (cd dist && sha256sum --check "Novel-Harness-Project-Starter-v${RELEASE_VERSION}-SHA256SUMS.txt")
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${RELEASE_VERSION}" dist/* \
            --title "Novel Harness Project Starter v${RELEASE_VERSION}" \
            --notes-file CHANGELOG.md \
            --prerelease
